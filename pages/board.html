<main id="main">
  <section class="page-hero">
    <div class="wrap">

      <h1>커뮤니티 게시판</h1>
      <p>공지, 취업 공고, 벼룩시장, 하우징, 자유게시판을 한 화면에서 검색하고 확인하세요.</p>
    </div>
  </section>

  <section class="section" id="board-top">
    <div class="wrap">
      <div class="board-toolbar">
        <div class="tabs" id="board-tabs"></div>
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

        </div>
      </div>

      <p class="section-sub" style="margin:0 0 12px" id="board-count"></p>

      <div class="table-card">
        <table class="post-table">
          <thead>
            <tr>
              <th class="c-cat">분류</th>
              <th>제목</th>
              <th class="c-author">작성자</th>
              <th class="c-date">날짜</th>
            </tr>
          </thead>
          <tbody id="post-tbody"></tbody>
        </table>
      </div>

      <div class="board-bottom">
        <div class="pager" id="board-pager"></div>
        <div class="board-bottom__write" id="board-write-slot"></div>
      </div>

      <div class="panel" style="margin-top:36px">
        <h3>게시판 이용 안내</h3>
        <ul style="display:grid;gap:6px">
          <li><span>· 글 작성은 로그인한 회원만 가능합니다. (백엔드 연동 후 활성화 예정)</span></li>
          <li><span>· 상업적 광고는 <a href="sponsors.html">후원업체</a> 절차를 거쳐 게시해 주세요.</span></li>
          <li><span>· 개인 간 거래로 발생한 분쟁에 대해 KGSA는 책임지지 않습니다.</span></li>
          <li><span>· 문의: <a href="mailto:kgsa@colorado.edu">kgsa@colorado.edu</a></span></li>
        </ul>
      </div>
    </div>
  </section>

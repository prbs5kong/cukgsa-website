<!DOCTYPE html>
<html lang="ko" data-root="../">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글쓰기 · CU Boulder KGSA</title>
<meta name="description" content="KGSA 게시판 글쓰기">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#cfb87c">
<link rel="icon" type="image/png" href="../assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="write.html">
<a class="skip-link" href="#main">본문 바로가기</a>
<div id="site-header"></div>

<main id="main">
  <section class="page-hero">
    <div class="wrap">
      <nav class="breadcrumb" aria-label="현재 위치">
        <a href="../index.html">홈</a><span>›</span><a href="board.html">게시판</a><span>›</span><span id="crumb">글쓰기</span>
      </nav>
      <h1 id="page-title">글쓰기</h1>
      <p>회원이라면 누구나 쓸 수 있습니다. 개인 간 거래는 본인 책임이며, 광고성 글은 삭제될 수 있습니다.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap" style="max-width:820px">
      <div id="gate" class="panel"><p class="note">불러오는 중…</p></div>

      <form class="panel form-grid" id="write-form" hidden novalidate>
        <div class="field">
          <label for="w-cat">게시판 <span class="req">*</span></label>
          <select id="w-cat" required>
            <option value="market">벼룩시장</option>
            <option value="housing">하우징</option>
            <option value="community">자유게시판</option>
            <option value="career" data-admin-only>취업 · 인턴 (운영진)</option>
            <option value="notice" data-admin-only>공지사항 (운영진)</option>
          </select>
        </div>
        <div class="field">
          <label for="w-title">제목 <span class="req">*</span></label>
          <input type="text" id="w-title" maxlength="150" required placeholder="예: 책상 · 의자 팝니다 (~8/30)">
        </div>
        <div class="field">
          <label for="w-body">내용 <span class="req">*</span></label>
          <textarea id="w-body" maxlength="20000" required
            placeholder="가격, 상태, 연락 방법(카톡 ID 등)을 적어 주세요."></textarea>
        </div>
        <div class="field">
          <label for="w-images">사진 (최대 8장, 장당 5MB)</label>
          <input type="file" id="w-images" accept="image/jpeg,image/png,image/webp,image/gif" multiple>
          <div class="thumb-row" id="w-thumbs"></div>
        </div>
        <div class="write-actions">
          <button type="submit" class="btn btn--primary" id="w-submit">등록하기</button>
          <a class="btn btn--outline" href="board.html">취소</a>
        </div>
        <p class="form-note" id="w-msg" role="status"></p>
      </form>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/kgsa-api.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/page-write.js"></script>
</body>
</html>
